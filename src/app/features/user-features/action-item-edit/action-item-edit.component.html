<form [formGroup]="editTodoForm" (ngSubmit)="onSubmit()">
  <h2 mat-dialog-title>Action Item</h2>
  <mat-dialog-content>
    <p>Created Date: {{ createdAt | date:'short' }}</p>
    <p>Last Modified Date: {{ updatedAt | date:'short' }}</p>

    <!-- First Row -->
    <div class="row mb-2">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title">
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Category</mat-label>
          <mat-select formControlName="category">
            <mat-option *ngFor="let option of category" [value]="option">{{ option }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <!-- Second Row -->
    <div class="row mb-2">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Due Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dueDate">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option *ngFor="let option of status" [value]="option">{{ option }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <!-- Third Row -->
    <div class="row mb-2">
      <div class="col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description"></textarea>
        </mat-form-field>
      </div>
    </div>

    <!-- Fourth Row -->
    <div class="row mb-2">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Measured By</mat-label>
          <input matInput formControlName="measuredBy" [disabled]="true">
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Target Value</mat-label>
          <input matInput type="number" formControlName="targetValue">
        </mat-form-field>
      </div>
    </div>

    <!-- Fifth Row -->
    <div class="row mb-2">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Current Value</mat-label>
          <input matInput type="number" formControlName="currentValue">
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Target Label</mat-label>
          <input matInput formControlName="targetLabel">
        </mat-form-field>
      </div>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-button color="primary" [disabled]="editTodoForm.invalid">Save</button>
  </mat-dialog-actions>
</form>
