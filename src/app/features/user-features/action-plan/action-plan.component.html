<section class="container-fluid">
  <app-back [name]="'Go Back'"></app-back>
  <app-title [title]="'Create Action Plan'"></app-title>
  <div class="todo-form-card w-75">
    <mat-card-content class="my-5">
      <form [formGroup]="todoForm" (ngSubmit)="createTodo()">
        <!-- Todo Name -->
        <div class="row">
          <div class="col-md-12 mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Todo Name</mat-label>
              <input matInput placeholder="Enter todo name" formControlName="title" required>
              <mat-error *ngIf="todoForm.get('title')?.invalid && todoForm.get('title')?.touched">
                Todo Name is required
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Todo Due Date -->
          <div class="col-md-12 mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Todo Due Date</mat-label>
              <input matInput [matDatepicker]="picker" placeholder="Select due date" formControlName="dueDate" required>
              <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
              <mat-error *ngIf="todoForm.get('dueDate')?.invalid && todoForm.get('dueDate')?.touched">
                Todo Due Date is required
              </mat-error>
            </mat-form-field>
          </div>
        </div>

        <div class="row">
          <!-- Todo Status -->
          <div class="col-md-12 mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Todo Status</mat-label>
              <mat-select placeholder="Select status" formControlName="status" required>
                <mat-option *ngFor="let stat of status" [value]="stat">
                  {{ stat }}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="todoForm.get('status')?.invalid && todoForm.get('status')?.touched">
                Todo Status is required
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Todo Category -->
          <div class="col-md-12 mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Todo Category</mat-label>
              <mat-select formControlName="category" required>
                <mat-option *ngFor="let cat of category" [value]="cat">
                  {{ cat }}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="todoForm.get('category')?.invalid && todoForm.get('category')?.touched">
                Todo Category is required
              </mat-error>
            </mat-form-field>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="row">
          <div class="col-md-12">
            <button mat-flat-button type="submit" class="mt-3 align-left" [disabled]="todoForm.invalid">Add Todo</button>
          </div>
        </div>
      </form>
    </mat-card-content>
  </div>

</section>
