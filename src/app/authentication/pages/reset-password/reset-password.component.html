<main class="app-primary-gradient">
  <section class="container-fluid app-page-center">
    <div class="card d-flex justify-content-center align-items-center">
      <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-12">
          <app-back [name]="'Back to Sign in'"></app-back>
          <div class="logo my-3">
            <img [alt]="altText" [src]="logo"/>
            <h2 class="mx-2">{{ title }}</h2>
            <p class="text-muted text-center">{{ subText[0] }}</p>
          </div>
          <form (ngSubmit)="resetPassword()" [formGroup]="resetPasswordForm">
            <!-- New Password Field -->
            <input class="form-control my-3 input" type="password" placeholder="New Password" formControlName="newPassword"/>
            @if (resetPasswordForm.get('newPassword')?.invalid  && resetPasswordForm.get('newPassword')?.touched) {
              <app-alerts [alertType]="'text-danger'" [alert]="'Please enter a valid password'"></app-alerts>
            }

            <!-- Confirm New Password Field -->
            <input class="form-control my-3 input" type="password" placeholder="Confirm New Password" formControlName="confirmPassword"/>
            @if (resetPasswordForm.get('confirmPassword')?.invalid  && resetPasswordForm.get('confirmPassword')?.touched) {
              <app-alerts [alertType]="'text-danger'" [alert]="'Passwords do not match'"></app-alerts>
            }

            <button [disabled]="resetPasswordForm.invalid" mat-flat-button>Reset Password</button>
          </form>
        </div>
        <div class="col-lg-4 col-md-4 col-sm-12">
          <img [alt]="altText" [src]="signInImage" class="app-right-image"/>
        </div>
      </div>
    </div>
  </section>
</main>
